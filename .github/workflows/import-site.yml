name: Import PhDessert site bundle

on:
  push:
    paths:
      - '_import/READY'

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and extract site bundle
        shell: bash
        run: |
          set -euo pipefail
          cat _import/chunk-*.b64 | base64 --decode > /tmp/phdessert-site.zip
          unzip -o /tmp/phdessert-site.zip -d .
          rm -rf _import
      - name: Commit imported site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: migrate PhDessert website into dedicated repository'
            git push
          fi
