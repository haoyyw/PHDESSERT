name: Final PhDessert site consistency optimization

on:
  push:
    paths:
      - '.github/workflows/final-site-optimization.yml'
      - '.github/scripts/finalize_site.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: RED — final consistency requirements are not yet met
        shell: bash
        run: |
          cat > /tmp/test_final_site.py <<'PY'
          from pathlib import Path
          import re

          s = Path('index.html').read_text(encoding='utf-8')
          failures = []

          whole_ids = [
              'yuzu-lemon-mousse',
              'basque-original','basque-cocoa','basque-matcha','basque-pistachio','basque-matcha-yuzu',
              'jasmine-grape-matcha','blueberry-cake','matcha-yuzu-cheesecake','mango-pomelo-coconut','light-cheesecake','strawberry-cream',
              'matcha-fig','fig-cheesecake',
          ]
          for pid in whole_ids:
              line = next((x for x in s.splitlines() if x.startswith("{id:'" + pid + "'")), '')
              if not line or 'sizePrices:' not in line:
                  failures.append(f'{pid}: missing sizePrices')
                  continue
              m = re.search(r"sizePrices:\{'4':'£([0-9.]+)','6':'£([0-9.]+)','8':'£([0-9.]+)',slice:'£([0-9.]+)'\}", line)
              if not m:
                  failures.append(f'{pid}: malformed sizePrices')
                  continue
              p4,p6,p8,ps = map(float,m.groups())
              if not (p4 < p6 < p8):
                  failures.append(f'{pid}: whole-cake size ladder is not increasing')
              if not ps > p8 / 8:
                  failures.append(f'{pid}: slice lacks retail premium')

          required = {
              'tasting product': "id:'chinese-tasting-box'",
              'tasting price': "priceEn:'£12.80 per set'",
              'tasting four-product collage': "collage:['peach-blossom','osmanthus-cake','mung-bean-cake','rice-cake']",
              'collage styling': '.product-collage{',
              'generic whole-cake renderer': 'p.sizePrices?cakePricing(p)',
              'seasonal cake pricing binding': 'bindCakePricing(root);bindOrder();wireImages(root)',
              'dynamic order sizes': 'function setOrderSizeForProduct(p,preferred=',
              'specific order price resolver': 'function resolveOrderPrice(p,sizeKey)',
              'card-selected size handoff': "b.dataset.size||p?.orderFormat||''",
              'roll explicit price': "priceEn:'Whole roll £18'",
              'bilingual tasting format': "tasting:'四件中式糕点拼盘'",
              'focus styling': '.cake-size-btn:focus-visible{',
          }
          for label, needle in required.items():
              if needle not in s:
                  failures.append(label)

          if 'From £' in s or '£ 起' in s:
              failures.append('vague From-price text remains')

          if failures:
              print('FINAL-SITE TEST FAIL')
              for f in failures:
                  print('-', f)
              raise SystemExit(1)
          print('FINAL-SITE TEST PASS')
          PY

          set +e
          python /tmp/test_final_site.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED unexpectedly passed before implementation.'
            exit 1
          fi
          echo 'RED confirmed: current site does not yet meet the approved final consistency requirements.'

      - name: Apply approved final optimization
        shell: bash
        run: |
          python -m py_compile .github/scripts/finalize_site.py
          python .github/scripts/finalize_site.py

      - name: GREEN — verify all final consistency requirements
        shell: bash
        run: python /tmp/test_final_site.py

      - name: Verify JavaScript syntax and HTML structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('<style>') == 1 and s.count('</style>') == 1
          assert s.count('<script>') == 1 and s.count('</script>') == 1
          assert "£12.80 per set" in s
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/phdessert.js').write_text(scripts[0], encoding='utf-8')
          print('HTML structural checks passed.')
          PY
          node --check /tmp/phdessert.js

      - name: Commit verified final site and remove one-off tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/final-site-optimization.yml .github/scripts/finalize_site.py
          git add index.html
          git commit -m 'feat: unify pricing and add Chinese tasting box'
          git push
