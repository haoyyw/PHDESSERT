name: Apply PhDessert cake size pricing

on:
  push:
    paths:
      - '.github/workflows/apply-cake-size-pricing.yml'

permissions:
  contents: write

jobs:
  apply-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: RED — verify size pricing is not implemented yet
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path

          s = Path('index.html').read_text(encoding='utf-8')
          expected = [
              '4″ £32 · 6″ £42 · 8″ £56 · Slice (1/8 of 8″) £7',
              '4″ £30 · 6″ £40 · 8″ £52 · Slice (1/8 of 8″) £6.50',
              '4″ £28 · 6″ £38 · 8″ £48 · Slice (1/8 of 8″) £6',
              '4″ £18 · 6″ £26 · 8″ £36 · Slice (1/8 of 8″) £4.50',
          ]
          missing = [x for x in expected if x not in s]
          if missing:
              print(f'EXPECTED RED: {len(missing)} required cake-size price strings are absent.')
              raise SystemExit(1)
          raise SystemExit('RED test unexpectedly passed: feature appears already implemented')
          PY
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test did not fail as expected'
            exit 1
          fi
          echo 'RED confirmed: current page does not yet satisfy the cake-size pricing requirement.'

      - name: Apply cake size and slice pricing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              "{id:'jasmine-grape-matcha'": (
                  "priceEn:'From £32',priceZh:'£32 起'",
                  "priceEn:'4″ £32 · 6″ £42 · 8″ £56 · Slice (1/8 of 8″) £7',priceZh:'4寸 £32 · 6寸 £42 · 8寸 £56 · 单片（8寸的1/8）£7'",
              ),
              "{id:'blueberry-cake'": (
                  "priceEn:'From £30',priceZh:'£30 起'",
                  "priceEn:'4″ £30 · 6″ £40 · 8″ £52 · Slice (1/8 of 8″) £6.50',priceZh:'4寸 £30 · 6寸 £40 · 8寸 £52 · 单片（8寸的1/8）£6.50'",
              ),
              "{id:'matcha-yuzu-cheesecake'": (
                  "priceEn:'From £28',priceZh:'£28 起'",
                  "priceEn:'4″ £28 · 6″ £38 · 8″ £48 · Slice (1/8 of 8″) £6',priceZh:'4寸 £28 · 6寸 £38 · 8寸 £48 · 单片（8寸的1/8）£6'",
              ),
              "{id:'mango-pomelo-coconut'": (
                  "priceEn:'From £32',priceZh:'£32 起'",
                  "priceEn:'4″ £32 · 6″ £42 · 8″ £56 · Slice (1/8 of 8″) £7',priceZh:'4寸 £32 · 6寸 £42 · 8寸 £56 · 单片（8寸的1/8）£7'",
              ),
              "{id:'light-cheesecake'": (
                  "priceEn:'From £18',priceZh:'£18 起'",
                  "priceEn:'4″ £18 · 6″ £26 · 8″ £36 · Slice (1/8 of 8″) £4.50',priceZh:'4寸 £18 · 6寸 £26 · 8寸 £36 · 单片（8寸的1/8）£4.50'",
              ),
              "{id:'strawberry-cream'": (
                  "priceEn:'From £28',priceZh:'£28 起'",
                  "priceEn:'4″ £28 · 6″ £38 · 8″ £48 · Slice (1/8 of 8″) £6',priceZh:'4寸 £28 · 6寸 £38 · 8寸 £48 · 单片（8寸的1/8）£6'",
              ),
          }

          lines = s.splitlines()
          changed = set()
          for i, line in enumerate(lines):
              for prefix, (old, new) in replacements.items():
                  if line.startswith(prefix):
                      if old not in line:
                          raise RuntimeError(f'Expected old price text not found for {prefix}')
                      lines[i] = line.replace(old, new, 1)
                      changed.add(prefix)
                      break

          if changed != set(replacements):
              missing = sorted(set(replacements) - changed)
              raise RuntimeError(f'Cake records not updated: {missing}')

          s = '\n'.join(lines) + '\n'

          size_old = '<option>Single / portion</option><option>Dessert box</option><option>4-inch</option><option>6-inch</option><option>Other / discuss</option>'
          size_new = '<option>Single / portion</option><option>Slice (1/8 of 8-inch cake)</option><option>Dessert box</option><option>4-inch</option><option>6-inch</option><option>8-inch</option><option>Other / discuss</option>'
          if size_old not in s:
              raise RuntimeError('Could not locate size dropdown options')
          s = s.replace(size_old, size_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: GREEN — verify cake price matrix and slice arithmetic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          s = Path('index.html').read_text(encoding='utf-8')
          cakes = {
              'jasmine-grape-matcha': (32, 42, 56, 7.00),
              'blueberry-cake': (30, 40, 52, 6.50),
              'matcha-yuzu-cheesecake': (28, 38, 48, 6.00),
              'mango-pomelo-coconut': (32, 42, 56, 7.00),
              'light-cheesecake': (18, 26, 36, 4.50),
              'strawberry-cream': (28, 38, 48, 6.00),
          }

          for pid, (p4, p6, p8, pslice) in cakes.items():
              m = re.search(r"\{id:'" + re.escape(pid) + r"'.*?priceEn:'([^']+)'.*?priceZh:'([^']+)'", s)
              if not m:
                  raise AssertionError(f'Missing product record for {pid}')
              en, zh = m.groups()
              expected_en = f'4″ £{p4:g} · 6″ £{p6:g} · 8″ £{p8:g} · Slice (1/8 of 8″) £{pslice:.2f}'.replace('.00', '')
              expected_zh = f'4寸 £{p4:g} · 6寸 £{p6:g} · 8寸 £{p8:g} · 单片（8寸的1/8）£{pslice:.2f}'.replace('.00', '')
              assert en == expected_en, (pid, en, expected_en)
              assert zh == expected_zh, (pid, zh, expected_zh)
              assert abs(pslice - p8 / 8) < 1e-9, (pid, pslice, p8 / 8)

          assert '<option>8-inch</option>' in s
          assert '<option>Slice (1/8 of 8-inch cake)</option>' in s
          print('GREEN confirmed: all six cake price matrices and 1/8-slice prices are correct.')
          PY

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/phdessert.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/phdessert.js

      - name: Commit cake pricing update and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-cake-size-pricing.yml
          git add index.html
          git commit -m 'feat: add cake size and slice pricing'
          git push
